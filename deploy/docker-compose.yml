# Hardened docker-compose for gate
# Enforces: read-only rootfs, no-new-privileges, dropped capabilities,
# seccomp BPF allowlist, non-root user, tmpfs for /tmp.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   podman-compose -f deploy/docker-compose.yml up -d

services:
  gate:
    # Pin to a minor tag to avoid surprise upgrades; bump explicitly.
    # Use `:latest` only in development.
    image: ghcr.io/murillo-consulting/gate:0.1.0
    build:
      context: ..
      dockerfile: Containerfile

    # Container mode listens on 8080. Set GATE_HOST_PORT=13456 if you
    # want the native host default on the outside.
    ports:
      - "${GATE_HOST_PORT:-8080}:8080"

    # ── Security hardening ──
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=seccomp.json
    cap_drop:
      - ALL
    user: "65534:65534"

    # Writable scratch space (noexec for defense-in-depth)
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

    volumes:
      # Config directory on the host (read-only bind mount)
      - ${GATE_CONFIG_DIR:-${HOME}/.gate/config}:/etc/gate:ro
      # Persistent data (spend DB, encryption keys)
      - gate-data:/var/lib/gate

    environment:
      - GATE_CONFIG=/etc/gate/config.toml
      - GATE_HOME=/var/lib/gate
      - RUST_LOG=info

    healthcheck:
      test: ["CMD", "/gate", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 64M
          cpus: "0.1"

volumes:
  gate-data:
